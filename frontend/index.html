<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolify - Digital Business Card</title>
    <!-- Outfit & Inter Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Glowing Aura Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="container">
        <!-- Status Indicator Badge -->
        <div id="status-badge" class="badge badge-mock">
            <span class="badge-dot"></span>
            <span class="badge-text">Offline Mock Mode</span>
        </div>

        <!-- Developer Profile Card -->
        <main class="profile-card">
            <!-- Header section: Avatar & Profile Bio -->
            <header class="profile-header">
                <div class="avatar-container">
                    <img id="dev-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=300&q=80" alt="Developer Avatar" class="avatar">
                    <div class="avatar-glow"></div>
                </div>
                <h1 id="dev-name" class="name">Loading Profile...</h1>
                <p id="dev-title" class="title">Please wait while we fetch the details</p>
                <p id="dev-bio" class="bio"></p>

                <!-- Action buttons: Follow & Link-in-bio -->
                <div class="action-buttons">
                    <button id="btn-follow" class="btn btn-primary">
                        <i class="fa-solid fa-user-plus"></i> Follow <span id="follower-count" class="count-badge">0</span>
                    </button>
                    <a id="btn-blog" href="#" target="_blank" class="btn btn-secondary">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i> Visit Blog
                    </a>
                </div>

                <!-- Social Media Account Links -->
                <div id="social-links" class="social-links">
                    <!-- Loaded dynamically -->
                </div>
            </header>

            <!-- Navigation tabs -->
            <nav class="profile-tabs">
                <button class="tab-link active" onclick="switchTab(event, 'tab-projects')">Projects</button>
                <button class="tab-link" onclick="switchTab(event, 'tab-skills')">Skills</button>
            </nav>

            <div class="tab-content-container">
                <!-- Projects Showcase Tab -->
                <section id="tab-projects" class="tab-content active-content">
                    <div id="projects-grid" class="projects-grid">
                        <!-- Loaded dynamically -->
                    </div>
                </section>

                <!-- Skills & Endorsements Tab -->
                <section id="tab-skills" class="tab-content">
                    <div id="skills-list" class="skills-list">
                        <!-- Loaded dynamically -->
                    </div>
                </section>
            </div>
        </main>
        
        <footer>
            <p>Powered by <span class="brand">Portfolify</span> SaaS platform &bull; Clean Architecture &copy; 2026</p>
        </footer>
    </div>

    <!-- Glassmorphic Endorsement Modal -->
    <div id="endorse-modal" class="modal">
        <div class="modal-content glass-card">
            <span class="close-btn" onclick="closeEndorseModal()">&times;</span>
            <h2>Endorse Skill</h2>
            <p class="modal-subtitle">Verify skill level for <span id="endorse-skill-name" class="highlight">Skill</span></p>
            
            <form id="endorse-form" onsubmit="submitEndorsement(event)">
                <input type="hidden" id="endorse-skill-id">
                
                <div class="form-group">
                    <label for="endorser-profile-select">Your Profile (Endorser)</label>
                    <select id="endorser-profile-select" class="form-control" required>
                        <!-- Loaded dynamically -->
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="endorse-comment">Comments / Endorsement Message</label>
                    <textarea id="endorse-comment" class="form-control" rows="3" placeholder="Tell others why you endorse this developer for this skill..." required></textarea>
                </div>
                
                <button type="submit" class="btn btn-submit btn-primary w-100">
                    <i class="fa-solid fa-heart"></i> Submit Endorsement
                </button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
